            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthClientDto'
  /api/notifications:
    get:
      operationId: findNotifications
      tags:
        - notifications
      parameters:
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged notifications (stub — always empty; the underlying provider was never ported to Quarkus).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotificationList'
components:
  parameters:
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    OrderParam:
      name: order
      in: query
      schema:
        type: string
    FetchParam:
      name: fetch
      in: query
      schema:
        type: string
  schemas:
    LocaleDto:
      description: >-
        A project's locale. Used for both the response body (all fields populated) and the
        create/update request body (projectId/name are read; the rest are server-computed
        and ignored if supplied). No field is marked `required` — see AccessTokenPayload's
        note on dual-purpose schemas.
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        whenUpdated:
          type: string
          format: date-time
          readOnly: true
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
          readOnly: true
        projectOwnerUsername:
          type: string
          readOnly: true
        name:
          type: string
        displayName:
          type: string
          readOnly: true
        progress:
          type: number
          format: double
          readOnly: true
        wordCount:
          type: integer
          readOnly: true
    PagedLocaleList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/LocaleDto'
          required: [list]
    KeyDto:
      description: >-
        A project's translation key. Used for both the response body (all fields populated)
        and the create/update request body (projectId/name are read; the rest are
        server-computed and ignored if supplied). No field is marked `required` — see
        AccessTokenPayload's note on dual-purpose schemas.
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        whenUpdated:
          type: string
          format: date-time
          readOnly: true
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
          readOnly: true
        projectOwnerUsername:
          type: string
          readOnly: true
        name:
          type: string
        progress:
          type: number
          format: double
          readOnly: true
        wordCount:
          type: integer
          readOnly: true
    PagedKeyList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/KeyDto'
          required: [list]
    PagedMemberList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MemberDto'
          required: [list]
    PagedMessageList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MessagePayload'
          required: [list]
    MessagePayload:
      type: object
      description: >-
        A translated message. Used for both the response body (all fields
        populated) and the create/update request body (id/localeId/keyId/
        value are read; the rest are server-computed and ignored if
        supplied). No field is marked `required` — see AccessTokenPayload's
        note on dual-purpose schemas.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        whenUpdated: { type: string, format: date-time, readOnly: true }
        localeId: { type: string, format: uuid }
        localeName: { type: string, readOnly: true }
        localeDisplayName:
          type: string
          readOnly: true
          description: >-
            Human-readable name of `localeName` rendered in the caller's
            preferred language, e.g. `"de"` -> `"German"`. Server-computed
            from `localeName`; only populated on the read endpoints, not on
            create/update/delete responses.
        keyId: { type: string, format: uuid }
        keyName: { type: string, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        projectName: { type: string, readOnly: true }
        value: { type: string, nullable: true }
        wordCount: { type: integer, readOnly: true, nullable: true }
    PageMetadata:
      type: object
      properties:
        total:
          type: integer
          readOnly: true
        offset:
          type: integer
          readOnly: true
        limit:
          type: integer
          readOnly: true
        hasNext:
          type: boolean
          readOnly: true
        hasPrev:
          type: boolean
          readOnly: true
      required: [total, offset, limit, hasNext, hasPrev]
    PagedAccessTokenList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/AccessTokenPayload'
          required: [list]
    AccessTokenPayload:
      type: object
      description: >-
        A personal access token. Used for both the response body (all fields
        populated) and the create/update request body (only name/scope are
        read; the rest are ignored if supplied). No field is marked
        `required`: this schema is deserialized on input as well as
        serialized on output, and jaxrs-spec's generated @JsonCreator
        enforces `required` on *both* directions — marking a
        server-generated field required breaks every create/update request,
        since those never supply it. See the design doc's "A schema used as
        both request and response body..." note.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        whenUpdated:
          type: string
          format: date-time
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        userUsername:
          type: string
          readOnly: true
        name:
          type: string
        key:
          type: string
          readOnly: true
          description: Server-generated; ignored if supplied by the client.
        scope:
          type: string
          nullable: true
    PagedProjectList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ProjectPayload'
          required: [list]
    MemberDto:
      type: object
      description: >-
        A project's member. Embedded read-only in ProjectPayload.members, and also
        MemberResource's own dual-purpose request/response body (projectId/userId/role are
        read on create; role is read on update; the rest are server-computed and ignored if
        supplied). No field is marked `required` — see AccessTokenPayload's note on
        dual-purpose schemas.
      properties:
        id: { type: integer, format: int64, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        projectId: { type: string, format: uuid }
        projectName: { type: string, readOnly: true }
        userId: { type: string, format: uuid }
        userUsername: { type: string, readOnly: true }
        userName: { type: string, readOnly: true }
        userEmailHash: { type: string, readOnly: true }
        role: { type: string }
    ProjectPayload:
      type: object
      description: >-
        A project. Used for both the response body (all fields populated,
        members/progress/myRole only when requested via ?fetch=) and the
        create/update request body (only name/description are read). No
        field is marked `required` — see AccessTokenPayload's note on
        dual-purpose schemas.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        whenUpdated: { type: string, format: date-time, readOnly: true }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: string, format: uuid, readOnly: true }
        ownerName: { type: string, readOnly: true }
        ownerUsername: { type: string, readOnly: true }
        ownerEmailHash: { type: string, readOnly: true }
        wordCount: { type: integer, readOnly: true, nullable: true }
        progress:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Populated only when the request opts in via ?fetch=progress.
        myRole:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Populated only via ?fetch=myrole on GET /api/{username}/{projectName},
            and only when the caller is authenticated.
        members:
          type: array
          readOnly: true
          nullable: true
          description: Populated only when the request opts in via ?fetch=members.
          items:
            $ref: '#/components/schemas/MemberDto'
    OidcProviderStatus:
      type: object
      description: Configuration and diagnostics for one auth provider (admin only).
      properties:
        key:
          type: string
          readOnly: true
          description: 'Provider key, e.g. "google".'
        listed:
          type: boolean
          readOnly: true
          description: Present in AUTH_PROVIDERS.
        active:
          type: boolean
          readOnly: true
          description: Listed AND fully configured AND no errors — usable now.
        provider:
          type: string
          readOnly: true
          nullable: true
          description: Quarkus built-in preset name, or null (Keycloak).
        authServerUrl:
          type: string
          readOnly: true
          nullable: true
          description: OIDC issuer URL; returned verbatim (not a credential).
        clientId:
          type: string
          readOnly: true
          nullable: true
          description: OAuth client id; returned verbatim (not a credential).
        clientSecret:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Masked as "***len:<N>***" where <N> is the configured secret's
            length, or null when no secret is configured. The real secret is
            never returned.
        scopes:
          type: array
          items:
            type: string
          readOnly: true
          description: Effective scope list (possibly empty).
        errors:
          type: array
          items:
            type: string
          readOnly: true
          description: Configuration problems (empty when healthy).
      required:
        - key
        - listed
        - active
        - scopes
        - errors
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required:
        - status
        - message
    PagedNotificationList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items: {}
          required: [list]
    GlobalFeatureFlagDto:
      type: object
      description: >-
        A global override for one feature flag. Used for both the response body (all fields
        populated) and the create/update request body (feature/enabled are read; the rest are
        server-computed and ignored if supplied). No field is marked `required` — see
        AccessTokenPayload's note on dual-purpose schemas.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        feature:
          type: string
        enabled:
          type: boolean
    ResolvedFeatureDto:
      type: object
      description: >-
        Per-feature resolution detail for the admin UI: the hardcoded default, the stored global
        setting (or absent), the caller's own override (value + row id, or absent), and the
        resulting effective value.
      properties:
        feature:
          type: string
          readOnly: true
        defaultEnabled:
          type: boolean
          readOnly: true
        global:
          type: boolean
          nullable: true
          readOnly: true
        userOverride:
          type: boolean
          nullable: true
          readOnly: true
        userOverrideId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        effective:
          type: boolean
          readOnly: true
      required:
        - feature
        - defaultEnabled
        - effective
    HealthStatus:
      type: object
      description: Liveness/readiness signal for monitoring and load balancers.
      properties:
        status:
          type: string
          readOnly: true
      required:
        - status
    StatisticsDto:
      type: object
      description: Aggregate counts across the whole instance (users, non-deleted projects, activity log entries).
      properties:
        userCount:
          type: integer
          format: int64
          readOnly: true
        projectCount:
          type: integer
          format: int64
          readOnly: true
        activityCount:
          type: integer
          format: int64
          readOnly: true
      required:
        - userCount
        - projectCount
        - activityCount
    AuthClientDto:
      type: object
      description: One usable auth provider — named in configuration AND backed by a configured client id/secret.
      properties:
        key:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
        - key
        - url
