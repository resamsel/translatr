openapi: 3.0.3
info:
  title: Translatr API
  version: 1.0.0
paths:
  /api/oidc-providers:
    get:
      operationId: listOidcProviders
      summary: List OIDC provider configuration and diagnostics (admin).
      tags:
        - oidc-providers
      responses:
        '200':
          description: Provider status list; client secret masked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OidcProviderStatus'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstokens:
    get:
      operationId: findAccessTokens
      summary: List the authenticated caller's access tokens.
      tags:
        - access-tokens
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: userId
          in: query
          description: >-
            Unused by the service today (the token list is always scoped to
            the authenticated caller) — accepted for backward compatibility
            with existing clients.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged access tokens for the authenticated caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccessTokenList'
  /api/accesstoken/{id}:
    get:
      operationId: getAccessToken
      summary: Get one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The deleted access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstoken:
    post:
      operationId: createAccessToken
      summary: Create an access token for the authenticated caller.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The created access token (key populated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
    put:
      operationId: updateAccessToken
      summary: Update an access token (name/scope). Carries its id in the body.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The updated access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects:
    get:
      operationId: findProjects
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: ownerUsername
          in: query
          schema:
            type: string
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjectList'
  /api/project/{id}:
    get:
      operationId: getProject
      tags:
        - projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
        '404':
          description: No project with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteProject
      tags:
        - projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The deleted project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
        '404':
          description: No project with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/{username}/{projectName}:
    get:
      operationId: getProjectByOwnerAndName
      tags:
        - projects
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: projectName
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FetchParam'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
        '404':
          description: No project with that owner and name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/project:
    post:
      operationId: createProject
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPayload'
      responses:
        '200':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
    put:
      operationId: updateProject
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPayload'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
  /api/messages:
    get:
      operationId: findMessages
      tags:
        - messages
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: localeId
          in: query
          schema:
            type: string
            format: uuid
        - name: localeIds
          in: query
          description: Comma-separated locale ids.
          schema:
            type: string
        - name: keyId
          in: query
          schema:
            type: string
            format: uuid
        - name: keyIds
          in: query
          description: Comma-separated key ids.
          schema:
            type: string
        - name: keyName
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageList'
  /api/project/{projectId}/messages:
    get:
      operationId: findMessagesByProject
      tags:
        - messages
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: localeId
          in: query
          schema:
            type: string
            format: uuid
        - name: localeIds
          in: query
          description: Comma-separated locale ids.
          schema:
            type: string
        - name: keyId
          in: query
          schema:
            type: string
            format: uuid
        - name: keyIds
          in: query
          description: Comma-separated key ids.
          schema:
            type: string
        - name: keyName
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged messages for the given project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageList'
  /api/message/{id}:
    get:
      operationId: getMessage
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        '404':
          description: No message with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMessage
      tags:
        - messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The deleted message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        '404':
          description: No message with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/message:
    post:
      operationId: createMessage
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePayload'
      responses:
        '200':
          description: The created message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        '404':
          description: No locale or key with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateMessage
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePayload'
      responses:
        '200':
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        '404':
          description: No message with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    OrderParam:
      name: order
      in: query
      schema:
        type: string
    FetchParam:
      name: fetch
      in: query
      schema:
        type: string
  schemas:
    PagedMessageList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MessagePayload'
          required: [list]
    MessagePayload:
      type: object
      description: >-
        A translated message. Used for both the response body (all fields
        populated) and the create/update request body (id/localeId/keyId/
        value are read; the rest are server-computed and ignored if
        supplied). No field is marked `required` — see AccessTokenPayload's
        note on dual-purpose schemas.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        whenUpdated: { type: string, format: date-time, readOnly: true }
        localeId: { type: string, format: uuid }
        localeName: { type: string, readOnly: true }
        keyId: { type: string, format: uuid }
        keyName: { type: string, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        projectName: { type: string, readOnly: true }
        value: { type: string, nullable: true }
        wordCount: { type: integer, readOnly: true, nullable: true }
    PageMetadata:
      type: object
      properties:
        total:
          type: integer
          readOnly: true
        offset:
          type: integer
          readOnly: true
        limit:
          type: integer
          readOnly: true
        hasNext:
          type: boolean
          readOnly: true
        hasPrev:
          type: boolean
          readOnly: true
      required: [total, offset, limit, hasNext, hasPrev]
    PagedAccessTokenList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/AccessTokenPayload'
          required: [list]
    AccessTokenPayload:
      type: object
      description: >-
        A personal access token. Used for both the response body (all fields
        populated) and the create/update request body (only name/scope are
        read; the rest are ignored if supplied). No field is marked
        `required`: this schema is deserialized on input as well as
        serialized on output, and jaxrs-spec's generated @JsonCreator
        enforces `required` on *both* directions — marking a
        server-generated field required breaks every create/update request,
        since those never supply it. See the design doc's "A schema used as
        both request and response body..." note.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        whenUpdated:
          type: string
          format: date-time
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        userUsername:
          type: string
          readOnly: true
        name:
          type: string
        key:
          type: string
          readOnly: true
          description: Server-generated; ignored if supplied by the client.
        scope:
          type: string
          nullable: true
    PagedProjectList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ProjectPayload'
          required: [list]
    Member:
      type: object
      description: A project's member (embedded in ProjectPayload.members).
      properties:
        id: { type: integer, format: int64, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        projectName: { type: string, readOnly: true }
        userId: { type: string, format: uuid, readOnly: true }
        userUsername: { type: string, readOnly: true }
        userName: { type: string, readOnly: true }
        userEmailHash: { type: string, readOnly: true }
        role: { type: string, readOnly: true }
    ProjectPayload:
      type: object
      description: >-
        A project. Used for both the response body (all fields populated,
        members/progress/myRole only when requested via ?fetch=) and the
        create/update request body (only name/description are read). No
        field is marked `required` — see AccessTokenPayload's note on
        dual-purpose schemas.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        whenCreated: { type: string, format: date-time, readOnly: true }
        whenUpdated: { type: string, format: date-time, readOnly: true }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: string, format: uuid, readOnly: true }
        ownerName: { type: string, readOnly: true }
        ownerUsername: { type: string, readOnly: true }
        ownerEmailHash: { type: string, readOnly: true }
        wordCount: { type: integer, readOnly: true, nullable: true }
        progress:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Populated only when the request opts in via ?fetch=progress.
        myRole:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Populated only via ?fetch=myrole on GET /api/{username}/{projectName},
            and only when the caller is authenticated.
        members:
          type: array
          readOnly: true
          nullable: true
          description: Populated only when the request opts in via ?fetch=members.
          items:
            $ref: '#/components/schemas/Member'
    OidcProviderStatus:
      type: object
      description: Configuration and diagnostics for one auth provider (admin only).
      properties:
        key:
          type: string
          readOnly: true
          description: 'Provider key, e.g. "google".'
        listed:
          type: boolean
          readOnly: true
          description: Present in AUTH_PROVIDERS.
        active:
          type: boolean
          readOnly: true
          description: Listed AND fully configured AND no errors — usable now.
        provider:
          type: string
          readOnly: true
          nullable: true
          description: Quarkus built-in preset name, or null (Keycloak).
        authServerUrl:
          type: string
          readOnly: true
          nullable: true
          description: OIDC issuer URL; returned verbatim (not a credential).
        clientId:
          type: string
          readOnly: true
          nullable: true
          description: OAuth client id; returned verbatim (not a credential).
        clientSecret:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Masked as "***len:<N>***" where <N> is the configured secret's
            length, or null when no secret is configured. The real secret is
            never returned.
        scopes:
          type: array
          items:
            type: string
          readOnly: true
          description: Effective scope list (possibly empty).
        errors:
          type: array
          items:
            type: string
          readOnly: true
          description: Configuration problems (empty when healthy).
      required:
        - key
        - listed
        - active
        - scopes
        - errors
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required:
        - status
        - message
