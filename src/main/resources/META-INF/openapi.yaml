openapi: 3.0.3
info:
  title: Translatr API
  version: 1.0.0
paths:
  /api/oidc-providers:
    get:
      operationId: listOidcProviders
      summary: List OIDC provider configuration and diagnostics (admin).
      tags:
        - oidc-providers
      responses:
        '200':
          description: Provider status list; client secret masked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OidcProviderStatus'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstokens:
    get:
      operationId: findAccessTokens
      summary: List the authenticated caller's access tokens.
      tags:
        - access-tokens
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: userId
          in: query
          description: >-
            Unused by the service today (the token list is always scoped to
            the authenticated caller) — accepted for backward compatibility
            with existing clients.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged access tokens for the authenticated caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccessTokenList'
  /api/accesstoken/{id}:
    get:
      operationId: getAccessToken
      summary: Get one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The deleted access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstoken:
    post:
      operationId: createAccessToken
      summary: Create an access token for the authenticated caller.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The created access token (key populated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
    put:
      operationId: updateAccessToken
      summary: Update an access token (name/scope). Carries its id in the body.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The updated access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    OrderParam:
      name: order
      in: query
      schema:
        type: string
    FetchParam:
      name: fetch
      in: query
      schema:
        type: string
  schemas:
    PageMetadata:
      type: object
      properties:
        total:
          type: integer
          readOnly: true
        offset:
          type: integer
          readOnly: true
        limit:
          type: integer
          readOnly: true
        hasNext:
          type: boolean
          readOnly: true
        hasPrev:
          type: boolean
          readOnly: true
      required: [total, offset, limit, hasNext, hasPrev]
    PagedAccessTokenList:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/AccessTokenPayload'
          required: [list]
    AccessTokenPayload:
      type: object
      description: >-
        A personal access token. Used for both the response body (all fields
        populated) and the create/update request body (only name/scope are
        read; the rest are ignored if supplied). No field is marked
        `required`: this schema is deserialized on input as well as
        serialized on output, and jaxrs-spec's generated @JsonCreator
        enforces `required` on *both* directions — marking a
        server-generated field required breaks every create/update request,
        since those never supply it. See the design doc's "A schema used as
        both request and response body..." note.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        whenCreated:
          type: string
          format: date-time
          readOnly: true
        whenUpdated:
          type: string
          format: date-time
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        userUsername:
          type: string
          readOnly: true
        name:
          type: string
        key:
          type: string
          readOnly: true
          description: Server-generated; ignored if supplied by the client.
        scope:
          type: string
          nullable: true
    OidcProviderStatus:
      type: object
      description: Configuration and diagnostics for one auth provider (admin only).
      properties:
        key:
          type: string
          readOnly: true
          description: 'Provider key, e.g. "google".'
        listed:
          type: boolean
          readOnly: true
          description: Present in AUTH_PROVIDERS.
        active:
          type: boolean
          readOnly: true
          description: Listed AND fully configured AND no errors — usable now.
        provider:
          type: string
          readOnly: true
          nullable: true
          description: Quarkus built-in preset name, or null (Keycloak).
        authServerUrl:
          type: string
          readOnly: true
          nullable: true
          description: OIDC issuer URL; returned verbatim (not a credential).
        clientId:
          type: string
          readOnly: true
          nullable: true
          description: OAuth client id; returned verbatim (not a credential).
        clientSecret:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Masked as "***len:<N>***" where <N> is the configured secret's
            length, or null when no secret is configured. The real secret is
            never returned.
        scopes:
          type: array
          items:
            type: string
          readOnly: true
          description: Effective scope list (possibly empty).
        errors:
          type: array
          items:
            type: string
          readOnly: true
          description: Configuration problems (empty when healthy).
      required:
        - key
        - listed
        - active
        - scopes
        - errors
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required:
        - status
        - message
