openapi: 3.0.3
info:
  title: Translatr API
  version: 1.0.0
paths:
  /api/oidc-providers:
    get:
      operationId: listOidcProviders
      summary: List OIDC provider configuration and diagnostics (admin).
      tags:
        - oidc-providers
      responses:
        '200':
          description: Provider status list; client secret masked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OidcProviderStatus'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstokens:
    get:
      operationId: findAccessTokens
      summary: List the authenticated caller's access tokens.
      tags:
        - access-tokens
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: userId
          in: query
          description: >-
            Unused by the service today (the token list is always scoped to
            the authenticated caller) — accepted for backward compatibility
            with existing clients.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged access tokens for the authenticated caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccessTokenList'
  /api/accesstoken/{id}:
    get:
      operationId: getAccessToken
      summary: Get one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by id.
      tags:
        - access-tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The deleted access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/accesstoken:
    post:
      operationId: createAccessToken
      summary: Create an access token for the authenticated caller.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The created access token (key populated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
    put:
      operationId: updateAccessToken
      summary: Update an access token (name/scope). Carries its id in the body.
      tags:
        - access-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenPayload'
      responses:
        '200':
          description: The updated access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenPayload'
        '404':
          description: No access token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects:
    get:
      operationId: findProjects
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FetchParam'
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: ownerUsername
          in: query
          schema:
            type: string
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjectList'
  /api/project/{id}:
    get:
      operationId: getProject
      tags:
        - projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayload'
        '404':
          description: No project with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteProject
