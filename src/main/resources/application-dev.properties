# Dev profile ? mirrors dev.conf
# Active when running: ./gradlew quarkusDev

# Use dev services (auto-starts Postgres testcontainer) if no DATABASE_URL is set
%dev.quarkus.datasource.devservices.enabled=false

# Verbose SQL in dev
%dev.quarkus.hibernate-orm.log.sql=true

# Quinoa: proxy to Angular dev server on port 4210, but do NOT start it.
# Start it manually: cd ui && NODE_OPTIONS=--openssl-legacy-provider npm start
# (requires Node 18 LTS ? see CONTRIBUTING.md)
%dev.quarkus.quinoa.enable=true
%dev.quarkus.quinoa.dev-server.port=4210
%dev.quarkus.quinoa.dev-server.managed=false

# Relax SSL in dev
%dev.quarkus.http.insecure-requests=enabled

