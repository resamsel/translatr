# Dev profile ? mirrors dev.conf
# Active when running: ./gradlew quarkusDev
quarkus.http.port=9000

# No dev services needed (e.g. auto-started Postgres testcontainer) ? skips the Docker
# environment probe entirely, avoiding the DOCKER_HOST connection-refused warning.
%dev.quarkus.devservices.enabled=false

# Verbose SQL in dev
%dev.quarkus.hibernate-orm.log.sql=true

# Quinoa ? serve pre-built UI from build/quinoa/ (staged by the copyUiToBuild Gradle task).
# The quarkusDev task automatically runs copyUiToBuild first, so no dev server is needed.
%dev.quarkus.quinoa.dev-server.port=4210
%dev.quarkus.quinoa.dev-server.managed=false
# Startup connectivity check timeout ? give the Angular dev server time to come up.
%dev.quarkus.quinoa.dev-server.check-timeout=30000
%dev.quarkus.quinoa.enable=true

# Relax SSL in dev
%dev.quarkus.http.insecure-requests=enabled
