# =============================================================================
# Translatr ? Quarkus application configuration
# Environment-specific values are read from the .env file in the project root.
# Quarkus reads .env automatically at startup ? no extra extension needed.
# =============================================================================

# -----------------------------------------------------------------------------
# Datasource (PostgreSQL)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Heroku's gradle/java buildpack derives JDBC_DATABASE_URL / _USERNAME / _PASSWORD
# from the DATABASE_URL of the attached Postgres add-on (Quarkus cannot parse the
# raw postgres://user:pass@host/db form itself). Fall back to the local dev DB.
quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/translatr}
quarkus.datasource.username=${JDBC_DATABASE_USERNAME:${DATABASE_USER:postgres}}
quarkus.datasource.password=${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:translatr}}

# HikariCP pool tuning (mirrors play.db.prototype.hikaricp settings)
quarkus.datasource.jdbc.min-size=${DATABASE_MIN_IDLE:2}
quarkus.datasource.jdbc.max-size=${DATABASE_MAX_POOL_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DATABASE_CONNECTION_TIMEOUT:5S}
quarkus.datasource.jdbc.max-lifetime=${DATABASE_CONNECTION_MAX_LIFETIME:5M}

# -----------------------------------------------------------------------------
# Flyway (replaces Play Evolutions)
# -----------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# baseline-on-migrate: if the schema is non-empty but has no Flyway history table
# (e.g. first run against an existing DB), create the history table and treat
# every migration up to baseline-version as already applied, then run the rest.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# -----------------------------------------------------------------------------
# Hibernate ORM (replaces Ebean)
# -----------------------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${DATABASE_LOG_SQL:false}
# Suppress the JSON-column format-mapper warning (no custom serialization)
quarkus.hibernate-orm.mapping.format.global=ignore
# Convert camelCase fields to snake_case column names (matches Ebean / Play Evolutions schema)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# -----------------------------------------------------------------------------
# OIDC providers (dynamic multi-tenant) ? see TranslatrTenantConfigResolver
# Credentials come from .env / the environment (OIDC_<PROVIDER>_* variables).
# -----------------------------------------------------------------------------
# OIDC providers are resolved dynamically per /login/{provider} by
# TranslatrTenantConfigResolver; the static default tenant is disabled.
quarkus.oidc.tenant-enabled=false

# --- Provider roster: aliases for the common OIDC_<PROVIDER>_* env vars --------
# Keycloak (no built-in preset → needs an explicit auth-server-url)
translatr.auth.oidc.keycloak.auth-server-url=${OIDC_KEYCLOAK_AUTH_SERVER_URL:}
translatr.auth.oidc.keycloak.client-id=${OIDC_KEYCLOAK_CLIENT_ID:}
translatr.auth.oidc.keycloak.client-secret=${OIDC_KEYCLOAK_CLIENT_SECRET:}
translatr.auth.oidc.keycloak.scopes=microprofile-jwt

translatr.auth.oidc.google.provider=google
translatr.auth.oidc.google.client-id=${OIDC_GOOGLE_CLIENT_ID:}
translatr.auth.oidc.google.client-secret=${OIDC_GOOGLE_CLIENT_SECRET:}
translatr.auth.oidc.google.scopes=email,profile

translatr.auth.oidc.github.provider=github
translatr.auth.oidc.github.client-id=${OIDC_GITHUB_CLIENT_ID:}
translatr.auth.oidc.github.client-secret=${OIDC_GITHUB_CLIENT_SECRET:}
translatr.auth.oidc.github.scopes=user:email

translatr.auth.oidc.facebook.provider=facebook
translatr.auth.oidc.facebook.client-id=${OIDC_FACEBOOK_CLIENT_ID:}
translatr.auth.oidc.facebook.client-secret=${OIDC_FACEBOOK_CLIENT_SECRET:}
translatr.auth.oidc.facebook.scopes=email

translatr.auth.oidc.twitter.provider=twitter
translatr.auth.oidc.twitter.client-id=${OIDC_TWITTER_CLIENT_ID:}
translatr.auth.oidc.twitter.client-secret=${OIDC_TWITTER_CLIENT_SECRET:}
# Mirrors the Quarkus `twitter` preset (which does not emit an `openid` scope);
# X's OAuth2 genuinely requires these scopes for a usable login.
translatr.auth.oidc.twitter.scopes=offline.access,tweet.read,users.read

translatr.auth.oidc.microsoft.provider=microsoft
translatr.auth.oidc.microsoft.client-id=${OIDC_MICROSOFT_CLIENT_ID:}
translatr.auth.oidc.microsoft.client-secret=${OIDC_MICROSOFT_CLIENT_SECRET:}
translatr.auth.oidc.microsoft.scopes=email,profile

translatr.auth.oidc.apple.provider=apple
translatr.auth.oidc.apple.client-id=${OIDC_APPLE_CLIENT_ID:}
translatr.auth.oidc.apple.client-secret=${OIDC_APPLE_CLIENT_SECRET:}
translatr.auth.oidc.apple.scopes=email,name


# Pin the SmallRye JWT JWKS URL to the correct modern Keycloak path (no /auth/ prefix).
# Without this, SmallRye JWT auto-discovers and constructs the stale legacy URL.
mp.jwt.verify.publickey.location=${OIDC_KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080/realms/Translatr}/protocol/openid-connect/certs
mp.jwt.verify.issuer=${OIDC_KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080/realms/Translatr}

# -----------------------------------------------------------------------------
# HTTP server
# -----------------------------------------------------------------------------
quarkus.http.port=9000
# Values: enabled (allow HTTP), redirect (redirect to HTTPS), disabled (HTTPS only).
# Set INSECURE_REQUESTS=redirect in production when an SSL cert is configured.
quarkus.http.insecure-requests=${INSECURE_REQUESTS:enabled}
# Behind a TLS-terminating router (Heroku), trust X-Forwarded-* so OIDC redirect
# URIs and generated links use https and the external host. Set
# PROXY_ADDRESS_FORWARDING=true in every environment fronted by such a router.
quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.enable-forwarded-host=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.enable-forwarded-prefix=${PROXY_ADDRESS_FORWARDING:false}

# -----------------------------------------------------------------------------
# Quinoa (Angular frontend)
# -----------------------------------------------------------------------------
quarkus.quinoa.enabled=true
quarkus.quinoa.ui-dir=ui
# Quinoa's Angular auto-detection rewrites build-dir/build-command from a
# (missing) root angular.json and mispackages this nx workspace; pin everything
# explicitly instead.
quarkus.quinoa.framework.detection=false
# build:ui:prod runs `nx build translatr --configuration production
# --output-path ../public/ui`; the Angular `application` builder writes the SPA
# to <output-path>/browser/, so that subdirectory is Quinoa's static root.
quarkus.quinoa.build-dir=../public/ui/browser
quarkus.quinoa.enable-spa-routing=true
# The SPA is built with `<base href="/ui/">`, and UiLandingResource / the OIDC
# post-logout path expect it under /ui; serve the static bundle there, not at /.
quarkus.quinoa.ui-root-path=/ui
# The ui `build` script also runs lint/test/e2e; a packaging build (CI, the
# Heroku dyno build) only needs the production bundle of the main SPA. The admin
# SPA is not served through Quinoa.
quarkus.quinoa.package-manager-command.build=run build:ui:prod
# The heroku/nodejs buildpack exports NODE_ENV=production into the gradle phase,
# and npm 11 honours it for `npm ci` as well - devDependencies (nx, the Angular
# builder, the prebuild `buildinfo` deps) are skipped and `build:ui:prod` then
# dies with `nx: not found`. Quinoa runs `ci` when a lockfile is present, so the
# dev tree has to be forced on both commands.
quarkus.quinoa.package-manager-command.ci=ci --include=dev
quarkus.quinoa.package-manager-command.install=install --include=dev
# Quinoa must build the SPA during `./gradlew stage`; the heroku/gradle buildpack
# phase has no Node on PATH, so let Quinoa provision its own (matches the Node
# major used by the Node CI workflow).
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.20.0
# Never forward these paths to the Angular dev server ? they belong to Quarkus
quarkus.quinoa.ignored-path-prefixes=/api,/health,/metrics,/q/,/login,/authenticate,/logout

# -----------------------------------------------------------------------------
# Micrometer / Prometheus metrics (replaces manual simpleclient)
# -----------------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# -----------------------------------------------------------------------------
# SmallRye Health
# -----------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/health

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true

# -----------------------------------------------------------------------------
# Native image (container build ? used in Phase 13)
# -----------------------------------------------------------------------------
quarkus.native.enabled=false
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# -----------------------------------------------------------------------------
# Custom Translatr config  ? values come from .env
# -----------------------------------------------------------------------------
translatr.auth.providers=${AUTH_PROVIDERS:keycloak}
translatr.redirect-base=${REDIRECT_BASE:http://localhost:4210}
translatr.base-url=${BASE_URL:http://localhost:8080}
# Extra origins (comma-separated) that LoginResource accepts as an absolute ?redirect_uri=
# after login, in addition to the redirect-base origin. Relative paths are always allowed;
# any other absolute URL falls back to /ui. Set when the admin SPA is served from a
# different origin than redirect-base (e.g. a separate dev-server port).
translatr.allowed-redirect-origins=${ALLOWED_REDIRECT_ORIGINS:}
translatr.admins=${ADMINS:}
translatr.force-ssl=${FORCE_SSL:false}
translatr.search.missing=false
translatr.search.limit=20
translatr.search.autocomplete.limit=3

# -----------------------------------------------------------------------------
# Quarkus Cache (Caffeine) ? Phase 9
# -----------------------------------------------------------------------------
quarkus.cache.caffeine."projects".maximum-size=1000
quarkus.cache.caffeine."projects".expire-after-write=15M
quarkus.cache.caffeine."keys".maximum-size=5000
quarkus.cache.caffeine."keys".expire-after-write=15M
quarkus.cache.caffeine."locales".maximum-size=2000
quarkus.cache.caffeine."locales".expire-after-write=15M
quarkus.cache.caffeine."users".maximum-size=500
quarkus.cache.caffeine."users".expire-after-write=30M

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
quarkus.log.level=${LOGLEVEL_ROOT:WARN}
quarkus.log.category."com.zaxxer.hikari".level=${LOGLEVEL_DATABASE_POOL:WARN}
quarkus.log.category."com.translatr".level=INFO

