# Test profile ? mirrors test.conf
# Active when running: ./gradlew test

# Quarkus Dev Services auto-starts a PostgreSQL testcontainer
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.username=translatr
%test.quarkus.datasource.password=translatr

# Auto-apply Flyway migrations in tests
%test.quarkus.flyway.migrate-at-start=true

# Disable Quinoa during tests (no frontend build needed)
%test.quarkus.quinoa.enable=false

# Disable OIDC enforcement during unit tests (use test security)
%test.quarkus.oidc.enabled=false
%test.quarkus.security.auth.enabled-in-dev-mode=false

