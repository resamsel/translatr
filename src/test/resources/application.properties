# Base application.properties required so that application-test.properties is loaded.
# All test-specific overrides live here using the %test. profile prefix.

# -----------------------------------------------------------------------------
# Disable ALL DevServices globally ? avoids Testcontainers/Ryuk entirely on Colima
# -----------------------------------------------------------------------------
%test.quarkus.devservices.enabled=false

# -----------------------------------------------------------------------------
# Datasource ? use the already-running docker-compose Postgres, avoid DevServices
# (DevServices would start a second Postgres via Testcontainers + Ryuk, which
# fails on Colima because Ryuk can't start in that environment)
# -----------------------------------------------------------------------------
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/translatr
%test.quarkus.datasource.username=postgres
%test.quarkus.datasource.password=translatr

# Keep Flyway running so the schema is always up-to-date; never clean in tests.
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=false

# -----------------------------------------------------------------------------
# OIDC ? disable the real server; @TestSecurity handles auth in tests
# Also disable the Keycloak DevService so Testcontainers/Ryuk is never invoked.
# -----------------------------------------------------------------------------
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:9999/realms/test
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.credentials.secret=test
%test.quarkus.keycloak.devservices.enabled=false

# -----------------------------------------------------------------------------
# Quinoa ? no Angular build/proxy needed in tests
# -----------------------------------------------------------------------------
%test.quarkus.quinoa.enable=false

# -----------------------------------------------------------------------------
# HTTP ? plain HTTP in tests, no SSL needed
# -----------------------------------------------------------------------------
%test.quarkus.http.insecure-requests=enabled

# -----------------------------------------------------------------------------
# Translatr app config ? provide concrete defaults so @QuarkusTest boots cleanly
# -----------------------------------------------------------------------------
%test.translatr.base-url=http://localhost:8081
%test.translatr.redirect-base=http://localhost:8081
%test.translatr.auth.providers=keycloak
# Lets the LoginResource unknown-provider guard treat "keycloak" as configured
# (the main roster resolves client-id to empty in tests). See LoginResourceTest.
%test.translatr.auth.oidc.keycloak.client-id=test-kc-id
# Exercises LoginResource's absolute-redirect allowlist (LoginResourceTest).
%test.translatr.allowed-redirect-origins=https://allowed.example.com

# -----------------------------------------------------------------------------
# Reduce noise in test output
# -----------------------------------------------------------------------------
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.translatr".level=DEBUG
%test.quarkus.hibernate-orm.log.sql=false



