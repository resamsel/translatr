<svg preserveAspectRatio="xMinYMin meet" [attr.viewBox]="viewBox" *transloco="let t">
  <g transform="translate(0,0)">
    <!-- months -->
    @for (month of monthTexts; track trackById($index, month)) {
      <text [attr.x]="month.x" [attr.y]="month.y" [attr.class]="'month'">{{ month.text }}</text>
    }

    <!-- weekdays -->
    @for (weekday of weekdayTexts; track trackById($index, weekday)) {
      <text [attr.x]="weekday.x" [attr.y]="weekday.y" [attr.class]="'weekday'" text-anchor="end">
        {{ weekday.text }}
      </text>
    }

    <!-- days -->
    @for (day of dayRects; track trackById($index, day)) {
      <rect
        [attr.x]="day.x"
        [attr.y]="day.y"
        [attr.width]="day.width"
        [attr.height]="day.height"
        [matTooltip]="day.title"
        [attr.class]="'day'"
      ></rect>
    }

    <!-- data -->
    @for (day of dataRects; track trackById($index, day)) {
      <rect
        [attr.x]="day.x"
        [attr.y]="day.y"
        [attr.width]="day.width"
        [attr.height]="day.height"
        matTooltip="{{ day.title }}: {{ day.value | shortNumber }}"
        [attr.class]="'day q' + color(day.value / maxValue)"
      ></rect>
    }

    <!-- legend -->
    @for (day of legendRects; track trackById($index, day)) {
      <rect
        [attr.x]="day.x"
        [attr.y]="day.y"
        [attr.width]="day.width"
        [attr.height]="day.height"
        [matTooltip]="day.title"
        [attr.class]="'day ' + day.clazz || ''"
      ></rect>
    }
    <text
      [attr.x]="width - (3 + numberOfColors + 1) * cellSize - 8 - offset.right"
      [attr.y]="height - 4"
      [attr.class]="'weekday'"
      text-anchor="end"
    >
      {{ t('contributions.legend.less') }}
    </text>
    <text
      [attr.x]="width - 3 * cellSize + 4 - offset.right"
      [attr.y]="height - 4"
      [attr.class]="'weekday'"
    >
      {{ t('contributions.legend.more') }}
    </text>
  </g>
</svg>
