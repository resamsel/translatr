@if (routerLink) {
  <a [queryParams]="queryParams" [routerLink]="routerLink">
    <ng-container [ngTemplateOutlet]="metric"></ng-container>
  </a>
} @else {
  <mat-card
    [class.icon]="icon !== undefined"
    matTooltip="{{name}}: {{value}}"
    >
    <mat-card-header>
      @if (value !== undefined) {
        <mat-card-title
          class="ellipsis"
        >{{ value }}</mat-card-title>
      }
      @if (value === undefined) {
        <mat-card-title>-</mat-card-title>
      }
      <mat-card-subtitle>{{ name }}</mat-card-subtitle>
    </mat-card-header>
    @if (icon !== undefined) {
      <div class="metric-icon">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
    }
  </mat-card>
}
<ng-template #metric>
  <mat-card
    [class.icon]="icon !== undefined"
    matTooltip="{{name}}: {{value}}"
    >
    <mat-card-header>
      @if (value !== undefined) {
        <mat-card-title
          class="ellipsis"
        >{{ value }}</mat-card-title>
      }
      @if (value === undefined) {
        <mat-card-title>-</mat-card-title>
      }
      <mat-card-subtitle>{{ name }}</mat-card-subtitle>
    </mat-card-header>
    @if (icon !== undefined) {
      <div class="metric-icon">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
    }
  </mat-card>
</ng-template>
