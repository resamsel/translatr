<mat-toolbar [class.mat-elevation-z2]="elevated" [color]="overlay ? undefined : 'primary'">
  <ng-container>
    <mat-toolbar-row>
      @if (sidenav) {
        <button mat-icon-button class="burger" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      @if (backLink) {
        @if (!sidenav) {
          <a
            mat-icon-button
            [routerLink]="backLink.routerLink"
            class="logo"
            [matTooltip]="backLink.name"
          >
            <mat-icon>arrow_back</mat-icon>
          </a>
        }
        <a [class.has-page]="!overlay && page" [routerLink]="backLink.routerLink" class="title">
          <span>{{ backLink.name }}</span>
        </a>
      } @else {
        @if (showLogo && !sidenav) {
          <a class="logo" mat-icon-button routerLink="/">
            <mat-icon>translate</mat-icon>
          </a>
        }
        @if (showLogo) {
          <a [class.has-page]="!overlay && page" class="title" routerLink="/">
            <span>{{ title }}</span>
          </a>
        }
      }
      @if (!overlay && page) {
        <span class="page">{{ page }}</span>
      }

      <ng-content select="app-search-bar"></ng-content>
      <ng-content select="dev-filter-field"></ng-content>

      <div class="flex-spacer"></div>

      <ng-content></ng-content>
    </mat-toolbar-row>
  </ng-container>
  <ng-container>
    <ng-content select="mat-toolbar-row"></ng-content>
  </ng-container>
</mat-toolbar>
