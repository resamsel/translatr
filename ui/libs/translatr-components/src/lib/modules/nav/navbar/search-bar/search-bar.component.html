<mat-form-field appearance="fill" class="search">
  <mat-chip-grid #chipGrid>
    @for (option of options; track option) {
      <mat-chip-row (removed)="onRemoved(option)" class="option">
        <span class="type">{{ option.type }}</span>
        <span class="value">{{ option.value }}</span>
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
    }
    <input
      #autocompleteInput
      (keydown.enter)="onEnter($event)"
      [formControl]="searchControl"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipGrid"
      autocomplete="off"
      matInput
      [placeholder]="'search.filter' | transloco"
      type="search"
    />
    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
      @for (option of autocompleteOptions; track option) {
        <mat-option (onSelectionChange)="onAutocompleteSelected($event)" [value]="option"
          >{{ option.type }}: {{ option.value }}</mat-option
        >
      }
    </mat-autocomplete>
  </mat-chip-grid>
  <button mat-icon-button matSuffix (click)="autocompleteTrigger.openPanel()">
    <mat-icon [inline]="true">expand_more</mat-icon>
  </button>
</mat-form-field>
