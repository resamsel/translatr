<app-nav-list
  [pagedList]="users"
  [criteria]="criteria"
  [showFilter]="true"
  [nothingFound]="nothingFound"
  (filter)="filter.emit($event)"
>
  @for (user of users?.list; track trackByFn($index, user)) {
    <a [routerLink]="['/', user.username]" mat-list-item>
      <img
        [md5Hash]="user.emailHash"
        class="icon"
        matListItemAvatar
        ngxGravatar
        size="36"
        [round]="false"
        [alt]="user.name"
        cornerRadius="6"
      />
      <h3 matListItemTitle>
        {{ user.name }} <span class="username">{{ user.username }}</span>
      </h3>
      <p class="sub-title" matListItemLine>
        <span
          transloco="user.memberships"
          [translocoParams]="{
            memberships: user.memberships !== undefined ? user.memberships.length : 0,
          }"
          >Contributing to {{ user.memberships?.length }} projects
        </span>
      </p>
      <p class="sub-title" matListItemLine>
        <span transloco="when.joined">Joined</span>&nbsp;<span>{{
          user.whenCreated | amTimeAgo
        }}</span>
      </p>
    </a>
  }
  <ng-template #nothingFound>
    <dev-empty-view icon="account_circle">
      <dev-empty-view-header transloco="users.notfound.title">No users found</dev-empty-view-header>
      <dev-empty-view-content transloco="users.notfound.text">
        Could not find any users with the given filter. Try removing some filters.
      </dev-empty-view-content>
    </dev-empty-view>
  </ng-template>
</app-nav-list>
