<div class="actions">
  @if (searchVisible) {
    <dev-filter-field
      [enabled]="searchEnabled"
      [filters]="filters"
      [selection]="selection"
      appearance="fill"
      color="accent"
      (selected)="onSelected($event)"
      >
      <mat-icon matPrefix>search</mat-icon>
    </dev-filter-field>
  }
  @if (removeVisible) {
    <button (click)="remove.emit()" [disabled]="!removeEnabled" i18n mat-icon-button>
    <mat-icon>remove</mat-icon>
  </button>
  }
</div>

@if (addVisible) {
  <button
    (click)="add.emit()"
    [attr.disabled]="!addEnabled"
    [matTooltip]="addTooltip"
    class="floating-action-btn pin-bottom"
    color="accent"
    mat-fab
    >
    <mat-icon>add</mat-icon>
  </button>
}
