<mat-card class="info portrait">
  <span mat-card-image>{{ firstChar($safeNavigationMigration(project?.name)) }}</span>
  <mat-card-content>
    <h2 class="ellipsis">{{ project?.name }}</h2>
    <p class="members">
      <img
        ngxGravatar
        [md5Hash]="$safeNavigationMigration(project?.ownerEmailHash)"
        size="36"
        [round]="false"
        cornerRadius="6"
        class="user-icon"
        [matTooltip]="$safeNavigationMigration(project?.ownerName)"
        [alt]="$safeNavigationMigration(project?.ownerName)"
      />
      <span class="owner ellipsis">{{ project?.ownerName }}</span>
      <span
        class="when-created"
        [matTooltip]="$safeNavigationMigration(project?.whenCreated) | date: 'full'"
        >{{ $safeNavigationMigration(project?.whenCreated) | amTimeAgo }}</span
      >
    </p>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
