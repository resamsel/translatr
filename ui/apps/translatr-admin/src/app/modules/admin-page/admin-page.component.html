<mat-sidenav-container class="admin-shell">
  <mat-sidenav
    #sidenav
    [mode]="(isLarge$ | async) ? 'side' : 'over'"
    [opened]="isLarge$ | async"
    class="sidenav dark-theme"
  >
    <mat-toolbar>
      <button (click)="sidenav.toggle()" mat-icon-button>
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span>Translatr Admin</span>
    </mat-toolbar>
    <mat-nav-list routerLinkActive>
      @for (child of children; track child) {
        <a
          (click)="sidenav.mode === 'over' && sidenav.close()"
          [class.list-item-active]="isLinkActive(routerLink(child))"
          [routerLink]="[routerLink(child)]"
          mat-list-item
        >
          <mat-icon matListItemIcon>{{ child.data.icon }}</mat-icon>
          {{ child.data.name }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-sidenav
      [me]="me$ | async"
      [overlay]="true"
      [page]="page ?? activePage()"
      [showLogo]="!sidenav.opened"
      [sidenav]="sidenav"
      [headerColor]="headerColor"
    >
      <ng-container ngProjectAs="app-search-bar">
        <ng-content select="app-search-bar"></ng-content>
      </ng-container>

      <div class="content">
        <ng-content></ng-content>
      </div>
    </app-sidenav>
  </mat-sidenav-content>
</mat-sidenav-container>
