<dev-admin-page [headerColor]="'#0288d1'">
  <div class="container">
    <p class="hint">
      Toggle a feature for everyone. Off falls back to the feature’s hardcoded default; a per-user
      override still wins over this.
    </p>

    <table [dataSource]="rows$ | async" mat-table>
      <ng-container matColumnDef="feature">
        <th *matHeaderCellDef mat-header-cell>Feature</th>
        <td *matCellDef="let row" mat-cell>
          <div class="title">{{ 'feature.name.' + row.feature | transloco }}</div>
          <div class="sub-title">{{ row.feature }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="default">
        <th *matHeaderCellDef mat-header-cell>Default</th>
        <td *matCellDef="let row" mat-cell>{{ row.defaultEnabled ? 'on' : 'off' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th *matHeaderCellDef class="actions" mat-header-cell>Enabled</th>
        <td *matCellDef="let row" class="actions" mat-cell>
          <mat-slide-toggle
            [checked]="row.enabled"
            [matTooltip]="row.enabled ? 'Enabled globally, toggle to disable' : 'Disabled, toggle to enable globally'"
            (change)="onToggle(row)"
          ></mat-slide-toggle>
        </td>
      </ng-container>

      <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
      <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
    </table>
  </div>
</dev-admin-page>
