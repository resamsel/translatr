<header [featureFlagClass]="{'header-graphic': Feature.HeaderGraphic}" class="header">
  <div class="container title">
    <div class="content">
      <h1 class="page">Dashboard</h1>
    </div>
  </div>
</header>
<div class="container flex">
  <dev-metric
    routerLink="/users"
    name="Users"
    [value]="$safeNavigationMigration((users$ | async)?.total) | shortNumber"
    icon="group"
    class="user count"></dev-metric>
  <dev-metric
    routerLink="/projects"
    name="Projects"
    [value]="$safeNavigationMigration((projects$ | async)?.total) | shortNumber"
    icon="library_books"
    class="project count"></dev-metric>
  <dev-metric
    routerLink="/accesstokens"
    name="Access Tokens"
    [value]="$safeNavigationMigration((accessTokens$ | async)?.total) | shortNumber"
    icon="vpn_key"
    class="access-token count"></dev-metric>
  <dev-metric
    name="Activity"
    [value]="$safeNavigationMigration((activities$ | async)?.total) | shortNumber"
    icon="change_history"
    class="activity count"></dev-metric>

  <dev-metric
    [routerLink]="userLink($safeNavigationMigration((users$ | async)?.list[0]))"
    [value]="$safeNavigationMigration((users$ | async)?.list[0]?.name)"
    class="user count"
    icon="group"
    name="Latest user"></dev-metric>
  <dev-metric
    [value]="$safeNavigationMigration((projects$ | async)?.list[0]?.name)"
    class="project count"
    icon="library_books"
    name="Latest project"></dev-metric>
  <dev-metric
    [value]="$safeNavigationMigration((accessTokens$ | async)?.list[0]?.name)"
    class="access-token count"
    icon="vpn_key"
    name="Latest access token"></dev-metric>
  <dev-metric
    [value]="$safeNavigationMigration((activities$ | async)?.list[0]?.type)"
    class="activity count"
    icon="change_history"
    name="Latest activity"></dev-metric>
</div>
