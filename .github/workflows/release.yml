name: Release Translatr

on:
  push:
    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

jobs:
  docker:
    name: Publish to Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker build -t "resamsel/translatr:${VERSION}" -t "resamsel/translatr:latest" .
          docker push "resamsel/translatr:${VERSION}"
          docker push "resamsel/translatr:latest"

  docker-loadgenerator:
    name: Publish Load Generator to Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Generate build info and API client
        working-directory: ui
        run: |
          npm run buildinfo
          npm run codegen

      - name: Build load generator
        working-directory: ui
        run: npm run build:lets-generate:prod

      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker build -t "resamsel/translatr-loadgenerator:${VERSION}" -t "resamsel/translatr-loadgenerator:latest" ui
          docker push "resamsel/translatr-loadgenerator:${VERSION}"
          docker push "resamsel/translatr-loadgenerator:latest"

  release:
    name: Create Release
    needs: [docker, docker-loadgenerator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate Changelog
        id: generate-changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyLastTag: true
          stripHeaders: true
          stripGeneratorNotice: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Translatr ${{ github.ref_name }}
          body: ${{ steps.generate-changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  cli-binaries:
    name: Publish CLI binaries
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install

      - name: Build native binaries for all platforms
        working-directory: cli
        run: bun run compile:all

      - name: Upload CLI binaries
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            cli/dist/bin/translatr-linux-x64
            cli/dist/bin/translatr-linux-arm64
            cli/dist/bin/translatr-macos-x64
            cli/dist/bin/translatr-macos-arm64
            cli/dist/bin/translatr-windows-x64.exe
