# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches:
    - main
    - feature/*
    - release/*
  pull_request:
    branches:
    - main
    - feature/*
    - release/*

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Lint, test and build translatr-ui
      working-directory: ui
      run: |
        npm install
        npm run lint
        npm run test
        npm run build:prod

    - name: Upload UI coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-coverage-report
        path: ui/coverage
        if-no-files-found: ignore

    - name: Build lets-release
      working-directory: lets-release
      run: |
        npm install
        npm run build

  e2e:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      working-directory: ui
      run: npm ci

    - name: Generate build info and API client
      working-directory: ui
      run: |
        npm run buildinfo
        npm run codegen

    - name: Install Playwright browser
      working-directory: ui
      run: npx playwright install --with-deps chromium

    - name: Run Playwright e2e (translatr, translatr-admin)
      working-directory: ui
      run: npx nx run-many --target=e2e --projects=translatr-e2e,translatr-admin-e2e

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ui/dist/.playwright
        if-no-files-found: ignore
