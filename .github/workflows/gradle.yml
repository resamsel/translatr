name: Quarkus CI

on:
  push:
    branches:
    - main
    - feature/*
    - release/*
  pull_request:
    branches:
    - main
    - feature/*
    - release/*

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: translatr
          POSTGRES_DB: translatr
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    - name: Test
      run: ./gradlew test

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-report
        path: build/reports/tests/test
        if-no-files-found: ignore
